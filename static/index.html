<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Nat's Code</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        --ink: #111;
        --muted: #57606a;
        --link: #265c83;
        --bg: #fff;
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 "avenir next", avenir, -apple-system, BlinkMacSystemFont,
          "Segoe UI", Roboto, sans-serif;
      }
      main { max-width: 820px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
      h1 { font-size: 2rem; font-weight: 400; line-height: 1.2; margin: 0 0 .5rem; }
      .lede { color: var(--muted); margin: 0 0 2.5rem; max-width: 46ch; }
      a { color: var(--link); text-decoration: none; }
      a:hover { text-decoration: underline; }
      #chart.empty { color: var(--muted); }
      .year { margin: 0 0 1.75rem; }
      .year-head { display: flex; align-items: baseline; gap: .6rem; margin: 0 0 .4rem; }
      .year-head h2 { font-size: 1.0625rem; font-weight: 600; margin: 0; }
      .year-head .total { font-size: .8125rem; color: var(--muted); }
      .cal-scroll { overflow-x: auto; padding-bottom: 2px; }
      .heatmap .cell { shape-rendering: crispEdges; }
      .legend { display: flex; align-items: center; gap: .4rem; margin: 2.25rem 0 0;
        font-size: .8125rem; color: var(--muted); }
      .legend .scale { display: inline-flex; gap: 2px; }
      .legend .scale span { width: 12px; height: 12px; border-radius: 2px; }
      footer { margin-top: 3rem; font-size: .875rem; color: var(--muted); }
      footer a { color: var(--link); }
    </style>
  </head>
  <body>
    <main>
      <h1>Nat's Code</h1>
      <p class="lede">
        Daily commit contributions across public GitHub repositories,
        refreshed from GitHub's API.
      </p>

      <div id="chart" class="empty">Loading…</div>

      <div class="legend" id="legend" hidden>
        <span>Less</span>
        <span class="scale"></span>
        <span>More</span>
      </div>

      <footer>
        A site by <a href="https://natwelch.com">@icco</a> ·
        <a href="https://github.com/icco/code.natwelch.com">Source</a> ·
        <a href="/data/contributions.csv">Data</a>
      </footer>
    </main>

    <script type="module" src="/app.js"></script>
  </body>
</html>
