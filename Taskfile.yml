version: "3"

tasks:
  build:
    desc: Build the binary to bin/code
    cmds:
      - go build -o bin/code .
  run:
    desc: Run the server locally
    cmds:
      - go run .
  test:
    desc: Run tests
    cmds:
      - go test -v -cover ./...
  lint:
    desc: Vet and staticcheck
    cmds:
      - go vet ./...
      - go run honnef.co/go/tools/cmd/staticcheck@latest ./...
